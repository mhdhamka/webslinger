name: Build Check & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Clean Install Dependencies
        # Use npm ci with a fallback to ensure optional native binaries for Tailwind Oxide install correctly on Linux
        run: |
          rm -rf node_modules package-lock.json
          npm install
        env:
          npm_config_platform: linux
          npm_config_arch: x64

      - name: Run Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'dummy_test_key_for_ci' }}
